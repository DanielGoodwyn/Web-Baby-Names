<!doctype html>
<head>
  <meta charset="utf-8">
  <title>Baby Names</title>
  <meta name="description" content="Baby Names">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=2">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css?v=8">
  <link type="text/css" rel="stylesheet" media="only screen and (max-width: 768px)" href="css/iPhone.css?v=8" />
  <script src="https://code.jquery.com/jquery-2.1.3.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="js/database-adapter.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.2/js/bootstrap.min.js"></script>
  <script>
    if (window.location.pathname.endsWith('/index.html')) {
      window.history.replaceState({}, document.title, window.location.pathname.replace(/\/index\.html$/, ''));
    }
  </script>
</head>
<body onload="currentPage('Account')">

  <div class="spacer"></div>
  <div id="main" class="container">
    <header>
      <h1>Baby Names</h1>
      <button id="account" class="selected" onclick="window.account()">Account</button>
      <button id="myNames" onclick="window.myNames()">My Names</button>
      <button id="newNames" onclick="window.newNames()">New Names</button>
    </header>
    <div class="row">
      <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
        <h2 id="pageTitle">Begin</h2>    

        <form id="loginForm" onsubmit="return false;">
          <input id="email" type="email" name="email" placeholder="Email" onkeypress="return begin(event)"><br>
          <input id="password" type="password" name="password" placeholder="Password" onkeypress="return begin(event)"><br>
          <a id="resetPassword" onclick="resetPassword()" style="cursor: pointer;">Forgot Password?</a><br><br>
        </form>
        <div class="clearfix"></div>
        <div id="authActions">
          <button id="beginActionBtn" class="green" onclick="beginWithButton()">Begin</button>
          <div id="googleAuthDivider" style="margin: 10px 0;">
            <span style="display:inline-block; width: 40%; border-top: 1px solid #ccc; vertical-align: middle;"></span>
            <span style="padding: 0 8px; font-size: 12px; color: #888;">OR</span>
            <span style="display:inline-block; width: 40%; border-top: 1px solid #ccc; vertical-align: middle;"></span>
          </div>
          <button id="googleBeginBtn" class="google-btn" onclick="beginWithGoogle()">
            <svg width="18" height="18" viewBox="0 0 18 18" style="vertical-align: middle; margin-right: 8px;">
              <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
              <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.173 0 7.548 0 9s.347 2.827.957 4.039l3.007-2.332z"/>
              <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
            </svg>
            Begin with Google
          </button>
        </div>
        <button style="display:none;" class="green" id="begin" onclick="window.newNames()">Find Names</button>
        <button style="display:none;" id="logOut" class="red" onclick="logOut()">Log Out</button>
        <p id="output"></p>
      </div>      
    </div>    
  </div>
  <footer>
    <span><a href="about.html#howto">How To</a></span>
    <button onclick="about()">About</button>
  </footer>
  <script src="js/babynames.js?v=4"></script>
</body>
</html>
